packages:
  - apps/*
  - packages/*

# Shared dependency versions: packages reference them as "catalog:".
catalog:
  # Expo SDK 58 targets TypeScript 6.0. Move to 7 (native compiler) once Expo and Next.js support it.
  typescript: 6.0.3
  vitest: 5.0.5
  "@types/node": 24.19.2
  zod: 4.6.7
  drizzle-orm: 0.45.4

# Install scripts are blocked by default; only these packages may run them.
allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.11"
  - "@better-auth/drizzle-adapter@1.7.11"
  - "@better-auth/kysely-adapter@1.7.11"
  - "@better-auth/memory-adapter@1.7.11"
  - "@better-auth/mongo-adapter@1.7.11"
  - "@better-auth/prisma-adapter@1.7.11"
  - "@better-auth/telemetry@1.7.11"
  - better-auth@1.7.11
