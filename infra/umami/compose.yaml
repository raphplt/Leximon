# Umami, the page-view counter of leximon.fr, on the home server (docs/mise-en-ligne.md, step 12 bis).
#   cp .env.example .env    # then fill the secrets and the tunnel token
#   docker compose up -d
# The dashboard is on port 3000 of this machine, through Tailscale only. Only the script and the
# collect endpoint reach the internet, through the Cloudflare tunnel (path rule set in Cloudflare).
services:
  umami:
    image: ghcr.io/umami-software/umami:3.4.1
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: ${APP_SECRET}
      # Behind the tunnel every request comes from cloudflared: the visitor is in this header.
      CLIENT_IP_HEADER: cf-connecting-ip
      DISABLE_TELEMETRY: 1
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 5

  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_PATH:-./data}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  tunnel:
    image: cloudflare/cloudflared:2026.10.5
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - umami
