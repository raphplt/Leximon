# Leximon database on the home server, sized for its 1.5 GB container.
# Goes to /etc/postgresql/18/main/conf.d/leximon.conf.

# pg_hba.conf only accepts the local cloudflared and, over TLS, the Proxmox host (SSH forward for
# migrations). No port of the home network is open to the Internet.
listen_addresses = '*'
max_connections = 100

shared_buffers = 384MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 128MB

# Every write of the game locks the player's wallet row: a transaction left open by a request that
# died would block that player for good. No transaction of the API or of a migration idles this long.
idle_in_transaction_session_timeout = 60s

wal_compression = on
max_wal_size = 1GB
# NVMe: an index read costs barely more than a sequential one.
random_page_cost = 1.1

# Cloudflare Origin certificate for db.leximon.fr: Workers VPC verifies it and rejects a self-signed
# one. The key was generated here and never left the container.
ssl = on
ssl_cert_file = '/etc/postgresql/18/main/db.crt'
ssl_key_file = '/etc/postgresql/18/main/db.key'
ssl_min_protocol_version = TLSv1.2
