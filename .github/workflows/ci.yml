name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: leximon
          POSTGRES_PASSWORD: leximon
          POSTGRES_DB: leximon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leximon -d leximon"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgres://leximon:leximon@localhost:5432/leximon
      TEST_DATABASE_URL: postgres://leximon:leximon@localhost:5432/leximon_test

    steps:
      # Actions are pinned to commit SHAs (tag in comment) to protect against tag hijacking.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
