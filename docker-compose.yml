# Local development services. Not used in production.
#   docker compose up -d                    Postgres only (daily development)
#   docker compose --profile content up -d  adds Directus, the content review tool
name: leximon

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: leximon
      POSTGRES_PASSWORD: leximon
      POSTGRES_DB: leximon
    ports:
      # Bound to localhost only; 54329 avoids clashing with other local Postgres instances.
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leximon -d leximon"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Creates the content database used by Directus, kept apart from the game database.
  content-db-init:
    profiles: ["content"]
    image: postgres:18.6-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: leximon
    entrypoint: ["sh", "-c"]
    command:
      - >-
        psql -h postgres -U leximon -d leximon -tc "select 1 from pg_database where datname = 'leximon_content'" | grep -q 1
        || psql -h postgres -U leximon -d leximon -c "create database leximon_content"

  directus:
    profiles: ["content"]
    image: directus/directus:12.4.1
    depends_on:
      content-db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8055:8055"
    volumes:
      - directus-uploads:/directus/uploads
    environment:
      SECRET: ${DIRECTUS_SECRET:?set DIRECTUS_SECRET in .env}
      PUBLIC_URL: http://127.0.0.1:8055
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: leximon_content
      DB_USER: leximon
      DB_PASSWORD: leximon
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:?set DIRECTUS_ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?set DIRECTUS_ADMIN_PASSWORD in .env}
      ADMIN_TOKEN: ${DIRECTUS_ADMIN_TOKEN:?set DIRECTUS_ADMIN_TOKEN in .env}
      TELEMETRY: "false"
    healthcheck:
      # The wget-based check from the Directus docs reports unhealthy here; Node fetch works.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8055/server/ping').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  directus-uploads:
